name: Deploy to Ncell VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/batobuzz
            # Force the VM checkout to match origin/main. The VM is a pure deploy
            # target - never hand-edit tracked files on it, or the change is lost
            # here. (A plain `git pull` aborts when a tracked file was edited on
            # the VM, which has broken this deploy repeatedly.)
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
